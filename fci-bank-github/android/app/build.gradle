plugins { id 'com.android.application' }

// The address of your hosted FCI server. Pass with:  gradle assembleDebug -PappUrl=https://your-host.example.com/
def appUrl = (project.findProperty('appUrl') ?: 'https://YOUR-HOST.example.com/').toString()

android {
    namespace 'com.fci.bank'
    compileSdk 34
    defaultConfig {
        applicationId 'com.fci.bank'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
