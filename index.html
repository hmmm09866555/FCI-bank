<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCI Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#050505;--bg2:#0e0e0f;--card:#141415;--el:#1c1c1e;--tx:#fff;--tx2:#9a9a9f;--bd:#262628;--ac:#c9ccd1;--up:#2fd68b;--dn:#ff5d5d;--bad:#ff5d5d;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:400 15px/1.5 Manrope,system-ui,sans-serif;min-height:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(104px + env(safe-area-inset-bottom,0px))}
#app.adm{max-width:none;padding:0}
h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
h2{font-size:28px;margin:4px 0 12px}h3{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);margin:26px 0 10px}
.mut{color:var(--tx2);font-size:13px}.c{text-align:center}.up{color:var(--up)}.dn{color:var(--dn)}.b{font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* buttons: one system */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;padding:0 18px;border:1px solid #38383b;background:var(--card);border-radius:14px;margin:10px 0;font-weight:600;font-size:14px;letter-spacing:.04em;transition:background .15s,transform .1s}
.btn:hover{background:var(--el)}.btn:active{transform:scale(.985)}
.btn.pri{background:linear-gradient(180deg,#f2f3f5,#bcc0c7);color:#08090a;border-color:transparent}.btn.pri:hover{filter:brightness(.95)}
.btn.up{background:var(--up);color:#03150c;border-color:transparent}.btn.dn{background:var(--dn);color:#1a0505;border-color:transparent}
.btn.bad{background:#2a1010;border-color:#5a2222;color:#ff8a8a}
.btn.sm{display:inline-flex;width:auto;height:38px;padding:0 16px;margin:0;border-radius:12px;font-size:13px;letter-spacing:.02em}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn-row .btn{margin:0}
.lnk{background:none;border:0;color:var(--ac);font-weight:600;font-size:13px;padding:8px 4px}.lnk:hover{color:#fff}
.lnks{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:10px}
.eye,.ib,.bk{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;color:var(--ac);flex:none}
.eye{width:36px;height:36px;color:var(--tx2)}
input,select,textarea{width:100%;height:52px;padding:0 14px;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;margin:6px 0 14px;font-size:16px}
textarea{height:auto;padding:14px}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
label{font-size:12px;color:var(--tx2);letter-spacing:.04em;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row.l{justify-content:flex-start}
.big{font:600 44px/1.05 'Cormorant Garamond',serif}
.logo{font:600 30px 'Cormorant Garamond',serif;letter-spacing:.14em;color:var(--ac);display:flex;align-items:center;gap:10px}
.ph{position:sticky;top:0;z-index:4;margin:-14px -18px 10px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;background:#050505e6;backdrop-filter:blur(14px);display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.pt{text-align:center;font-weight:700;font-size:16px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--dn);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0bf0;backdrop-filter:blur(16px);border-top:1px solid var(--bd);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;max-width:480px;margin:0 auto}.nav button{flex:1;padding:10px 0 9px;background:none;border:0;color:var(--tx2);font-size:10px;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:#fff}.nav button.on svg{stroke:var(--ac)}.nav .mid span{width:46px;height:46px;border-radius:50%;margin-top:-22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f2f3f5,#a9adb4);color:#050505;border:4px solid var(--bg)}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #1c1c1e;cursor:pointer}.li:last-child{border:0}
.ico{width:42px;height:42px;border-radius:14px;background:var(--el);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ac)}
.li .m{flex:1;min-width:0}.li .m div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--up)}.neg{color:#e6e6e6}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0 4px}.qa button{background:none;border:0;font-size:11px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600}
.qa i{width:56px;height:56px;border-radius:18px;background:linear-gradient(145deg,#232326,#111);border:1px solid #333;display:flex;align-items:center;justify-content:center;color:var(--ac)}
.pill{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600;background:#ffffff10}
.scroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 2px 6px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.scroll>*{flex:0 0 92%;scroll-snap-align:center}
.scroll.sm>*{flex:0 0 44%}.dots2{display:flex;gap:6px;justify-content:center;margin-top:4px}.dots2 i{width:6px;height:6px;border-radius:3px;background:#444}.dots2 i.on{width:18px;background:var(--ac)}
.promo{border-radius:20px;padding:20px;border:1px solid #2c4a3f;background:radial-gradient(circle at 90% 0,#2f8f7255,transparent 55%),linear-gradient(135deg,#0f1f19,#0a0a0a);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chips.x{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips.x::-webkit-scrollbar{display:none}
.chips button{height:34px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:12px;font-weight:600;flex:none}.chips button.on{background:var(--ac);color:#050505;border-color:var(--ac)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px;margin:6px 0 14px}.seg button{height:38px;border:0;border-radius:10px;background:none;font-weight:600;font-size:13px;color:var(--tx2)}.seg button.on{background:var(--el);color:#fff;box-shadow:0 0 0 1px #3a3a3d inset}.seg button.on.g{background:var(--up);color:#03150c}.seg button.on.r{background:var(--dn);color:#1a0505}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.presets button{height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-weight:600;font-size:13px}
.picker{display:flex;gap:12px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}.picker::-webkit-scrollbar{display:none}
.picker button{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:var(--tx2);font-size:11px;font-weight:600}.picker .sw{width:70px;height:46px;border-radius:10px;border:2px solid transparent;box-shadow:0 0 0 1px #ffffff22 inset}.picker button.on{color:#fff}.picker button.on .sw{border-color:#fff}
.bar{height:6px;background:var(--el);border-radius:6px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a8d93,#e6e8eb)}
.sheet{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg2);border:1px solid var(--bd);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;max-height:88vh;overflow:auto;animation:upk .25s}
.sheet.mod{align-items:center;padding:20px}.sheet.mod>div{border-radius:22px;max-width:760px;max-height:90vh}
@keyframes upk{from{transform:translateY(30px);opacity:0}}@keyframes pop{from{transform:scale(.5);opacity:0}}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1c1c1ef2;backdrop-filter:blur(12px);border:1px solid #3a3a3d;padding:11px 18px;border-radius:14px;z-index:50;font-size:13px;max-width:90%;box-shadow:0 10px 30px #000a;animation:upk .25s}
.av{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font:600 28px 'Cormorant Garamond',serif;background:linear-gradient(145deg,#4a4d52,#17181a);border:1px solid #555;flex:none}
#load{position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
.ld{width:120px;height:2px;background:var(--el);margin-top:22px;overflow:hidden}.ld i{display:block;width:40%;height:100%;background:var(--ac);animation:ld 1.1s infinite}@keyframes ld{from{margin-left:-40%}to{margin-left:100%}}
.pinbox{display:flex;gap:12px;justify-content:center;margin:18px 0 8px;cursor:text}.pinbox i{width:54px;height:62px;border-radius:14px;border:1px solid #3a3a3d;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:26px;font-style:normal}.pinbox i.f{border-color:var(--ac)}.pinbox i.cur{border-color:#fff}
.hid{position:absolute;opacity:0;width:1px;height:1px;left:-999px}
.amt{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px 0 6px}.amt span{font:600 40px 'Cormorant Garamond',serif;color:var(--tx2)}.amt input{width:60%;height:auto;border:0;background:none;font:600 52px 'Cormorant Garamond',serif;text-align:left;padding:0;margin:0;min-width:0}
.cr{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:14px;margin:8px 0;cursor:pointer;background:var(--card)}.cr.on{border-color:var(--ac);background:#ffffff0d}
.sw{width:46px;height:30px;border-radius:7px;flex:none;border:1px solid #fff3}
.rowk{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1c1c1e;gap:14px}.rowk:last-child{border:0}.rowk span:first-child{color:var(--tx2)}.rowk span:last-child{text-align:right}
.cap{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 0;font-size:13px;color:var(--tx2)}.cap b{color:#fff;font-weight:600}
.nd{width:9px;height:9px;border-radius:50%;background:var(--up);flex:none}
.chk{width:84px;height:84px;border-radius:50%;margin:30px auto 14px;display:flex;align-items:center;justify-content:center;background:#2fd68b22;border:2px solid var(--up);color:var(--up);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
/* cards */
.pc{position:relative;aspect-ratio:1.586;border-radius:20px;padding:18px 20px;overflow:hidden;color:#eceef1;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 36px #000c,inset 0 0 0 1px #ffffff1f;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s;cursor:pointer;user-select:none}
.pc .shn{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff1c 50%,transparent 65%);background-size:250% 100%;background-position:var(--mx,100%) 0;pointer-events:none}
.pc.obsidian{background:repeating-linear-gradient(45deg,#ffffff08 0 2px,transparent 2px 6px),linear-gradient(135deg,#1c1d20,#050505 60%,#222428)}
.pc.onyx{background:linear-gradient(115deg,transparent 58%,#ffffff12 58% 59.2%,transparent 59.2%),linear-gradient(135deg,#151516,#000)}
.pc.titanium{background:repeating-linear-gradient(100deg,#ffffff0a 0 1px,transparent 1px 4px),linear-gradient(135deg,#50555d,#22252a 55%,#444a52)}
.pc.platinum{color:#17181a;background:repeating-linear-gradient(90deg,#ffffff38 0 1px,transparent 1px 3px),linear-gradient(135deg,#f4f5f7,#a7abb2 50%,#e9ebee)}
.pc.gold{color:#2a1d05;background:repeating-linear-gradient(90deg,#ffffff22 0 1px,transparent 1px 3px),linear-gradient(135deg,#f7e6a8,#cba24a 45%,#8f6c24 75%,#ecd48f)}
.pc.rose{color:#3a1712;background:repeating-linear-gradient(90deg,#ffffff22 0 1px,transparent 1px 3px),linear-gradient(135deg,#f7d5cd,#c98577 50%,#f0c4ba)}
.pc.copper{color:#2b1306;background:repeating-linear-gradient(90deg,#ffffff1f 0 1px,transparent 1px 3px),linear-gradient(135deg,#f0c19a,#b86a3a 50%,#e3a77a)}
.pc.glacier{color:#0d2433;background:radial-gradient(circle at 85% 8%,#fff 0,transparent 46%),linear-gradient(135deg,#e2f3fc,#9fcbe6)}
.pc.emerald{background:radial-gradient(circle at 88% 0,#2f8f7288 0,transparent 48%),repeating-radial-gradient(circle at 0 100%,#ffffff0f 0 1px,transparent 1px 9px),linear-gradient(145deg,#0f3a2c,#04120d)}
.pc.midnight{background:radial-gradient(#ffffff16 1px,transparent 1.5px) 0 0/16px 16px,radial-gradient(circle at 90% 0,#3b5bff55,transparent 52%),linear-gradient(145deg,#0a1130,#04060f)}
.pc.ruby{background:radial-gradient(ellipse at 15% -10%,#ff8a8a55,transparent 55%),repeating-linear-gradient(135deg,#ffffff0a 0 1px,transparent 1px 6px),linear-gradient(145deg,#7a0f1f,#25040a)}
.pc.aurora{background:radial-gradient(circle at 82% 18%,#3de0ff55,transparent 42%),radial-gradient(circle at 8% 92%,#4a5cff55,transparent 46%),linear-gradient(145deg,#10131c,#05060a)}
.sw.obsidian{background:linear-gradient(135deg,#222428,#050505)}.sw.onyx{background:linear-gradient(135deg,#1a1a1b,#000)}.sw.titanium{background:linear-gradient(135deg,#60666e,#2a2d33)}.sw.platinum{background:linear-gradient(135deg,#f4f5f7,#a7abb2)}.sw.gold{background:linear-gradient(135deg,#f7e6a8,#8f6c24)}.sw.rose{background:linear-gradient(135deg,#f7d5cd,#c98577)}.sw.copper{background:linear-gradient(135deg,#f0c19a,#b86a3a)}.sw.glacier{background:linear-gradient(135deg,#e2f3fc,#9fcbe6)}.sw.emerald{background:linear-gradient(135deg,#1f6b53,#04120d)}.sw.midnight{background:linear-gradient(135deg,#2a3fa8,#04060f)}.sw.ruby{background:linear-gradient(135deg,#b3243a,#25040a)}.sw.aurora{background:linear-gradient(135deg,#3de0ff,#10131c)}.sw.sapphire{background:linear-gradient(135deg,#3b6fe0,#050d24)}.sw.sunset{background:linear-gradient(135deg,#ff7a45,#5b2a86)}.sw.neon{background:linear-gradient(135deg,#ff2bd6,#19e6ff)}.sw.holo{background:conic-gradient(from 200deg,#ffd1f4,#c3ecff,#d9ffe0,#fff4c2,#ffd1f4)}.sw.marble{background:linear-gradient(135deg,#f6f6f4,#cfcec9)}.sw.void{background:linear-gradient(135deg,#5a2bd0,#000)}
.pc.sapphire{background:radial-gradient(circle at 85% 0,#6ea8ff66,transparent 50%),repeating-linear-gradient(120deg,#ffffff0a 0 1px,transparent 1px 5px),linear-gradient(145deg,#12307a,#050d24)}
.pc.sunset{background:radial-gradient(circle at 20% 110%,#ffd36677,transparent 50%),linear-gradient(135deg,#ff7a45,#e0356b 55%,#5b2a86)}
.pc.neon{background:radial-gradient(circle at 15% 20%,#ff2bd677,transparent 40%),radial-gradient(circle at 90% 85%,#19e6ff77,transparent 42%),linear-gradient(145deg,#0b0420,#050210)}
.pc.holo{color:#1a1830;background:conic-gradient(from 200deg at 65% 35%,#ffd1f4,#c3ecff,#d9ffe0,#fff4c2,#ffd1f4)}
.pc.marble{color:#1b1b1d;background:repeating-linear-gradient(115deg,transparent 0 22px,#00000010 22px 23px,transparent 23px 47px),radial-gradient(circle at 80% 20%,#fff,transparent 50%),linear-gradient(135deg,#f6f6f4,#d7d6d2)}
.pc.void{background:radial-gradient(circle at 50% 120%,#7a35ff66,transparent 55%),repeating-radial-gradient(circle at 50% 120%,#ffffff08 0 1px,transparent 1px 14px),linear-gradient(160deg,#0a0612,#000)}
.pc.off{filter:grayscale(.85) brightness(.65)}
.pc .r1,.pc .r2,.pc .r3{display:flex;justify-content:space-between;position:relative}.pc .r1,.pc .r2{align-items:center}.pc .r3{align-items:flex-end}
.pc .wm{font:700 12px Manrope;letter-spacing:.35em}.pc .tier{font:700 9px/1.3 Manrope;letter-spacing:.28em;opacity:.85;text-align:right}
.pc .num{font:600 17px/1 Manrope;letter-spacing:.16em;position:relative;text-shadow:0 1px 0 #ffffff30,0 -1px 0 #00000060}
.pc small{font-size:8px;letter-spacing:.2em;opacity:.65;display:block;font-weight:600;margin-bottom:2px}.pc .r3 div{font-size:11.5px;letter-spacing:.08em;font-weight:600}
.net{display:flex}.net i{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;opacity:.75}.net i+i{margin-left:-11px}
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);border:2px solid currentColor;padding:2px 14px;letter-spacing:.3em;font-weight:700;font-size:15px;background:#0006;color:#fff}
/* trading */
.cvw{position:relative;margin:0 -18px}canvas{width:100%;height:330px;display:block;touch-action:pan-y}
.tfb{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin:6px 0 10px}.tfb button{height:34px;background:none;border:0;border-radius:10px;color:var(--tx2);font-weight:600;font-size:13px}.tfb button.on{background:var(--el);color:#fff}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center;font-size:13px;font-weight:600}.stat small{display:block;font-size:10px;color:var(--tx2);font-weight:500;letter-spacing:.06em}
.tbar{position:fixed;left:0;right:0;bottom:0;background:#0a0a0bf2;backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}.tbar div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.tbar .btn{margin:0}
.lg{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:700 11px Manrope;letter-spacing:.04em;flex:none;color:#fff}
.tape{overflow:hidden;white-space:nowrap;border:1px solid var(--bd);border-radius:12px;background:var(--card);padding:9px 0;font-size:12.5px;margin:6px 0 12px}.tape>div{display:inline-block;animation:tape 70s linear infinite}@keyframes tape{to{transform:translateX(-50%)}}
/* admin dashboard */
.A{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.A aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--bd);padding:22px 14px;background:#09090a;display:flex;flex-direction:column;gap:4px;overflow:auto}
.A aside .logo{padding:0 10px 18px;font-size:24px}.A nav button{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border:0;background:none;border-radius:12px;color:var(--tx2);font-weight:600;font-size:14px;margin:1px 0;text-align:left}
.A nav button:hover{background:#ffffff08;color:#fff}.A nav button.on{background:var(--el);color:#fff}.A nav .cnt{margin-left:auto;background:var(--dn);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;height:18px;line-height:18px}
.A main{padding:26px 34px 70px;max-width:1280px;width:100%}
.A .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.A .top h1{font-size:34px}.A .top input{width:280px;margin:0;height:44px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}.kpi .v{font:600 30px 'Cormorant Garamond',serif;line-height:1.1;margin-top:4px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}.g2 .card{margin:0}

// Makes the FCI app's `claude.use('db')` / `claude.use('user')` calls work on Supabase.
(function () {
  const cfg = window.FCI_CONFIG || {};
  if (!window.supabase || !cfg.SUPABASE_URL || /YOUR-/.test(cfg.SUPABASE_URL)) {
    console.error('FCI: fill in config.js with your Supabase URL and anon key.');
    return;
  }
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  const T = 'docs';
  const mk = (r) => ({ id: r.id, data: () => r.data });

  // ---- live collection cache + listeners ----
  const cache = {};      // col -> Map(id -> row)
  const subs = {};       // col -> Set(callbacks)
  let channel = null;

  const snap = (col) => ({ docs: [...(cache[col]?.values() || [])].map(mk) });
  const fire = (col) => subs[col]?.forEach((s) => s.ok(snap(col)));

  function ensureChannel() {
    if (channel) return;
    channel = sb.channel('fci-docs')
      .on('postgres_changes', { event: '*', schema: 'public', table: T }, (p) => {
        const r = p.new && p.new.collection ? p.new : p.old;
        if (!r || !cache[r.collection]) return;
        if (p.eventType === 'DELETE') cache[r.collection].delete(r.id);
        else cache[r.collection].set(r.id, r);
        fire(r.collection);
      })
      .subscribe();
  }

  async function load(col) {
    const { data, error } = await sb.from(T).select('*').eq('collection', col);
    if (error) throw error;
    cache[col] = new Map(data.map((r) => [r.id, r]));
  }

  function collection(col) {
    return {
      onSnapshot(ok, err) {
        (subs[col] ??= new Set());
        const s = { ok, err };
        subs[col].add(s);
        ensureChannel();
        load(col).then(() => ok(snap(col))).catch((e) => err && err(e));
        return () => subs[col].delete(s);
      },
      doc: (id) => docRef(col, id),
    };
  }

  function docRef(col, id) {
    return {
      async get() {
        const { data, error } = await sb.from(T).select('data').eq('collection', col).eq('id', id).maybeSingle();
        if (error) throw error;
        return { exists: !!data, data: () => data?.data };
      },
      async set(d) {
        const { error } = await sb.from(T).upsert({ collection: col, id, data: d, updated_at: new Date().toISOString() });
        if (error) throw error;
        if (cache[col]) { cache[col].set(id, { collection: col, id, data: d }); fire(col); }
      },
      async update(patch) {
        const { error } = await sb.rpc('merge_doc', { p_col: col, p_id: id, p_patch: patch });
        if (error) throw error;
        const cur = cache[col]?.get(id);
        if (cur) { cur.data = { ...cur.data, ...patch }; fire(col); }

        const { data, error } = await sb.rpc('acquire_lock', { p_key: id, p_holder: holder, p_ttl_ms: ttlMs });
        if (error) throw error;
        return { acquired: !!data };
      },
    };
  }

  const DB = {
    collection,
    doc(path) { const i = path.indexOf('/'); return docRef(path.slice(0, i), path.slice(i + 1)); },
  };

  // ---- admin sign-in (Supabase Auth, email must be in the admins table) ----
  async function isAdmin() {
    const { data } = await sb.auth.getSession();
    const email = data.session?.user?.email;
    if (!email) return false;
    const { data: row } = await sb.from('admins').select('email').eq('email', email).maybeSingle();

  }

  function adminLogin() {
    return new Promise((resolve) => {
      const o = document.createElement('div');
      o.style.cssText = 'position:fixed;inset:0;background:#000d;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';

        <input id="ap" type="password" placeholder="Password" autocomplete="current-password">
        <p id="am" style="color:#ff5d5d;font-size:13px;min-height:18px"></p>

        <button id="ax" class="btn">CANCEL</button></div>`;
      document.body.append(o);
      o.querySelector('#ax').onclick = () => { o.remove(); resolve(false); };
      o.querySelector('#ab').onclick = async () => {
        const { error } = await sb.auth.signInWithPassword({ email: o.querySelector('#ae').value.trim(), password: o.querySelector('#ap').value });

        o.remove(); resolve(true);
      };
    });
  }

  const USR = {
    async canEdit() {
      if (await isAdmin()) return true;
      if (location.hash === '#admin') return adminLogin();
      return false;
    },
    async can() { return true; },
  };

  // If someone opens #admin later (after load), sign in then reload.
  addEventListener('hashchange', async () => {
    if (location.hash === '#admin' && !(await isAdmin())) { if (await adminLogin()) location.reload(); }

  window.claude = { use: async (n) => (n === 'db' ? DB : n === 'user' ? USR : null) };
})();

function aRew(){const us=Object.keys(S.users);return`<div class="g2"><div class="card"><h3 style="margin-top:0">Award points</h3><label>User</label><select id="rwu">${us.map(k=>`<option value="${k}">${esc(nm(k))} · ${pts(k)} pts</option>`).join('')}</select><label>Points (negative removes)</label><input id="rwn" type="text" inputmode="numeric" value="100"><label>Reason</label><input id="rwr" value="Reward from FCI"><button class="btn pri" onclick="ptsDo($('#rwu').value)">AWARD</button></div>
<div class="card"><h3 style="margin-top:0">Reward catalogue</h3>${REW.map(([n,p])=>`<div class="rowk"><span>${n}</span><b>${p} pts</b></div>`).join('')}<h3>Recent redemptions</h3>${S.redeem.slice(0,6).map(r=>`<div class="rowk"><span>${esc(nm(r.user))} · ${esc(r.item)}</span><span>-${r.cost}</span></div>`).join('')||'<p class="mut">None yet.</p>'}</div></div>`}
function aSet(){const s=S.set;return`<div class="card" style="max-width:640px"><div class="fgrid"><div><label>Session timeout (seconds)</label><input id="sto" type="text" inputmode="numeric" value="${s.timeout}"></div><div><label>Registration</label><select id="sre"><option value="1" ${s.reg?'selected':''}>Open</option><option value="0" ${s.reg?'':'selected'}>Closed</option></select></div><div><label>Users can add money to themselves</label><select id="ssd"><option value="1" ${s.selfDep?'selected':''}>Yes</option><option value="0" ${s.selfDep?'':'selected'}>No</option></select></div><div><label>Maintenance mode</label><select id="smt"><option value="0" ${s.maint?'':'selected'}>Off</option><option value="1" ${s.maint?'selected':''}>On (clients locked out)</option></select></div><div><label>Per-transaction limit (R)</label><input id="smx" type="text" inputmode="decimal" value="${s.maxTx}"></div><div><label>Daily spending limit (R)</label><input id="sdl" type="text" inputmode="decimal" value="${s.dailyLimit}"></div></div><button class="btn pri" onclick="aSetSave()">SAVE SETTINGS</button></div>`}
async function aSetSave(){await put('settings',{timeout:Math.max(30,num($('#sto').value)||300),reg:$('#sre').value==='1',selfDep:$('#ssd').value==='1',maint:$('#smt').value==='1',maxTx:num($('#smx').value)||100000,dailyLimit:num($('#sdl').value)||250000},'main');logA('Settings changed');toast('Settings saved')}
function aHealth(){const us=Object.keys(S.users),neg=us.filter(k=>bal(k)<0),cc=[];us.forEach(k=>(S.users[k].cards||[]).forEach(c=>{if(c.type==='Credit'&&avail('cc:'+c.id)<0)cc.push([k,c])}));const ids=allTx().map(t=>t.id),dup=ids.length-new Set(ids).size,orph=allTx().filter(t=>(t.from&&!S.users[t.from]&&!/^(cc:|pk:|MARKET)/.test(t.from))||(t.to&&!S.users[t.to]&&!/^(cc:|pk:|MARKET)/.test(t.to))).length;
 const ck=(ok,t,d)=>`<div class="rowk"><span>${t}<br><span style="font-size:11px">${d}</span></span><span class="st ${ok?'ok':'no'}">${ok?'OK':'Issue'}</span></div>`;
 return`<div class="g2"><div class="card"><h3 style="margin-top:0">Ledger integrity</h3>${ck(!neg.length,'No negative balances',neg.length?neg.map(k=>nm(k)+' '+R(bal(k))).join(', '):'All balances are zero or above')}${ck(!cc.length,'Credit cards within limit',cc.length?cc.length+' over limit':'All within limit')}${ck(!dup,'No duplicate transaction IDs',dup+' duplicates')}${ck(!orph,'All entries reference known accounts',orph+' unknown references')}${neg.length?`<button class="btn" onclick="sure('Add corrective deposits to bring negative balances to zero?',aFixNeg,'FIX BALANCES')">FIX NEGATIVE BALANCES</button>`:''}</div>
<div class="card"><h3 style="margin-top:0">System</h3><div class="rowk"><span>Users</span><span>${us.length}</span></div><div class="rowk"><span>Ledger entries</span><span>${S.ledger.length}</span></div><div class="rowk"><span>Admin entries</span><span>${S.adm.length}</span></div><div class="rowk"><span>Audit entries</span><span>${S.audit.length}</span></div><div class="rowk"><span>Write protection</span><span>Per-account lock + retry</span></div></div></div>`}
async function aFixNeg(){for(const k of Object.keys(S.users).filter(k=>bal(k)<0)){const r=await post({from:null,to:k,amt:-bal(k),desc:'Balance correction',cat:'Adjustment',kind:'deposit',adm:true,source:'FCI'});if(typeof r!=='string')logA('Corrected negative balance for @'+k)}toast('Done')}
function aAudit(){return`<div class="tw"><table class="tbl"><tr><th>Time</th><th>Action</th></tr>${S.audit.map(a=>`<tr><td>${fmt(a.at)}</td><td style="white-space:normal">${esc(a.a)}</td></tr>`).join('')||'<tr><td colspan="2" class="mut">No entries yet.</td></tr>'}</table></div>`}
init();
</script></body></html>
